name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: aiproject_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GROQ_API_KEY: dummy-key-for-ci
      OPENAI_API_KEY: dummy-key-for-ci
      SECRET_KEY: dummy-secret-for-ci
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: test
      DB_NAME: aiproject_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install WeasyPrint system dependencies (Pango/Cairo)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libpangocairo-1.0-0 libcairo2 \
            libgdk-pixbuf-2.0-0 shared-mime-info fonts-dejavu-core

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check syntax
        run: python -m py_compile app.py db.py

      - name: Smoke test (App-Import inkl. DB-Migration gegen den MySQL-Service)
        run: python -c "import app"

      - name: Build Docker image
        run: docker build -t aiproject-app .
