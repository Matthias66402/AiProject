services:
  mysql:
    image: mysql:8.0
    container_name: aiproject_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - aiproject_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: aiproject_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Innerhalb des Docker-Netzwerks wird mysql über den Servicenamen und den
      # internen Port erreicht, nicht über den nach außen gemappten ${DB_PORT}.
      DB_HOST: mysql
      DB_PORT: 3306
    ports:
      - "5003:5003"
    volumes:
      # Erzeugte PDFs (Lebensläufe, Stellenangebote) landen so direkt im
      # lokalen data/-Ordner statt in der (bei Neustart verlorenen)
      # schreibbaren Container-Schicht.
      - ./data:/app/data
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  aiproject_mysql_data:
