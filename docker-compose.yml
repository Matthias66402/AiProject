services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aiproject_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - aiproject_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: aiproject_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Innerhalb des Docker-Netzwerks wird postgres über den Servicenamen und
      # den internen Port erreicht, nicht über den nach außen gemappten ${DB_PORT}.
      DB_HOST: postgres
      DB_PORT: 5432
      # Origin des React-PoC-Frontends (frontend/) - für CORS auf den /api/*-Routen.
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "5003:5003"
    volumes:
      # Erzeugte PDFs (Lebensläufe, Stellenangebote) landen so direkt im
      # lokalen data/-Ordner statt in der (bei Neustart verlorenen)
      # schreibbaren Container-Schicht.
      - ./data:/app/data
      # Quellcode gemountet, damit Flasks Reloader (debug=True) Änderungen
      # sofort übernimmt - kein "docker compose up --build" bei jeder
      # Code-/Template-Änderung mehr nötig. Nur bei geänderten
      # Abhängigkeiten (requirements.txt) oder dem Dockerfile ist ein
      # Rebuild weiterhin erforderlich.
      - ./app.py:/app/app.py
      - ./api:/app/api
      - ./db:/app/db
      - ./models:/app/models
      - ./services:/app/services
      - ./embeddings.py:/app/embeddings.py
      - ./document_extraction.py:/app/document_extraction.py
      - ./backfill_embeddings.py:/app/backfill_embeddings.py
      - ./migrate_mysql_to_postgres.py:/app/migrate_mysql_to_postgres.py
      - ./templates:/app/templates
      - ./static:/app/static
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: aiproject_frontend
    restart: unless-stopped
    working_dir: /app
    # PoC-Setup: Vite-Dev-Server direkt aus einem Node-Image, kein eigenes
    # Dockerfile nötig. "npm install" läuft bei jedem Start erneut (node_modules
    # ist nicht Teil des Bind-Mounts) - für den PoC in Ordnung, für Dauerbetrieb
    # würde man das in ein eigenes Image mit vorinstallierten Abhängigkeiten packen.
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:5003
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - app

volumes:
  aiproject_postgres_data:
