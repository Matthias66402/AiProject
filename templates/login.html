<div class="scroll">
    <h1 id="greetings">Anmelden</h1>
    <p class="subtitle">Melde dich mit deinen Zugangsdaten an</p>

    {% if error %}
    <p class="form-error">{{ error }}</p>
    {% endif %}

    <form action="{{ url_for('login') }}" method="POST">
        <div>
            <label for="email">E-Mail</label>
            <input id="email" name="email" type="email" value="{{ request.form.get('email', '') }}" required>
        </div>
        <div>
            <label for="password">Passwort</label>
            <input id="password" name="password" type="password" required>
        </div>
        <button id="special-btn" type="submit">Anmelden</button>
    </form>
    <p class="subtitle">Noch kein Konto? <a href="{{ url_for('register') }}">Jetzt registrieren</a></p>
</div>
