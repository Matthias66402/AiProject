<nav class="flex flex-wrap items-center justify-between">
    <button id="nav-toggle" type="button"
            class="md:hidden text-[#ffe9a8] text-xl px-1"
            aria-label="Menü öffnen" aria-expanded="false" aria-controls="nav-links">
        <i class="fa-solid fa-bars"></i>
    </button>

    <div id="nav-links" class="hidden md:flex w-full md:flex-1 flex-col md:flex-row md:items-center gap-3 md:gap-5 mt-3 md:mt-0">
        <a href="{{ url_for('home') }}" class="{{ 'active' if request.endpoint == 'home' else '' }}"><i class="fa-solid fa-home text-xl text-[#76A250]"></i> Start</a>
        <a href="{{ url_for('jobs') }}" class="{{ 'active' if request.endpoint in ('jobs', 'edit_job') else '' }}"><i class="fa-solid fa-briefcase text-xl text-[#76A250]"></i> Stellenangebote</a>
        <a href="{{ url_for('customers') }}" class="{{ 'active' if request.endpoint in ('customers', 'edit_customer') else '' }}"><i class="fa-solid fa-building text-xl text-[#76A250]"></i> Stellenanbieter</a>

        <details class="relative md:ml-auto">
            <summary class="cursor-pointer flex items-center gap-2 px-3 py-1.5 rounded-lg border border-[rgba(255,215,130,0.35)] bg-[rgba(0,0,0,0.2)] text-[#ffe9a8] text-sm select-none w-fit">
                <i class="fa-solid fa-user text-[#76A250]"></i>
                {{ current_user.short_name if current_user else 'Konto' }}
                <i class="fa-solid fa-chevron-down text-xs"></i>
            </summary>
            <div class="flex flex-col md:absolute md:right-0 md:w-48 mt-2 bg-[#241141] border border-[rgba(255,215,130,0.35)] rounded-lg overflow-hidden md:shadow-lg z-10">
                {% if current_user %}
                <a href="{{ url_for('logout') }}" class="!normal-case px-4 py-2 hover:bg-[rgba(255,255,255,0.08)]"><i class="fa-solid fa-right-from-bracket text-[#76A250]"></i> Abmelden</a>
                {% else %}
                <a href="{{ url_for('login') }}" class="!normal-case px-4 py-2 hover:bg-[rgba(255,255,255,0.08)]"><i class="fa-solid fa-right-to-bracket text-[#76A250]"></i> Anmelden</a>
                <a href="{{ url_for('register') }}" class="!normal-case px-4 py-2 hover:bg-[rgba(255,255,255,0.08)]"><i class="fa-solid fa-user-plus text-[#76A250]"></i> Registrieren</a>
                {% endif %}
            </div>
        </details>
    </div>
</nav>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        var toggle = document.getElementById('nav-toggle');
        var links = document.getElementById('nav-links');
        if (!toggle || !links) return;
        toggle.addEventListener('click', function () {
            var isOpen = !links.classList.toggle('hidden');
            toggle.setAttribute('aria-expanded', String(isOpen));
        });
    });
</script>
