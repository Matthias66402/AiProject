<div class="scroll">
    <h1 id="greetings">Registrieren</h1>
    <p class="subtitle">Erstelle ein neues Konto</p>

    {% if error %}
    <p class="form-error">{{ error }}</p>
    {% endif %}

    <form action="{{ url_for('register') }}" method="POST">
        <div>
            <label for="first_name">Vorname</label>
            <input id="first_name" name="first_name" type="text" value="{{ request.form.get('first_name', '') }}" required>
        </div>
        <div>
            <label for="last_name">Nachname</label>
            <input id="last_name" name="last_name" type="text" value="{{ request.form.get('last_name', '') }}" required>
        </div>
        <div>
            <label for="short_name">Kurzname</label>
            <input id="short_name" name="short_name" type="text" value="{{ request.form.get('short_name', '') }}" required>
        </div>
        <div>
            <label for="email">E-Mail</label>
            <input id="email" name="email" type="email" value="{{ request.form.get('email', '') }}" required>
        </div>
        <div>
            <label for="zip">PLZ</label>
            <input id="zip" name="zip" type="text" value="{{ request.form.get('zip', '') }}" required>
        </div>
        <div>
            <label for="city">Stadt</label>
            <input id="city" name="city" type="text" value="{{ request.form.get('city', '') }}" required>
        </div>
        <div>
            <label for="password">Passwort</label>
            <input id="password" name="password" type="password" required>
        </div>
        <div>
            <label for="password_confirm">Passwort wiederholen</label>
            <input id="password_confirm" name="password_confirm" type="password" required>
        </div>
        <button id="special-btn" type="submit">Registrieren</button>
    </form>
    <p class="subtitle">Bereits registriert? <a href="{{ url_for('login') }}">Jetzt anmelden</a></p>
</div>
